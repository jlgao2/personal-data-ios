name: PersonalData
options:
  bundleIdPrefix: com.jlgao
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  PersonalData:
    type: application
    platform: iOS
    sources:
      - path: PersonalData
        excludes:
          - "**/.DS_Store"
    info:
      path: PersonalData/Resources/Info.plist
      properties:
        CFBundleDisplayName: Frontal Lobe
        UILaunchScreen:
          UIColorName: ""
        NSHealthShareUsageDescription: Reads heart rate, sleep, weight, and other vitals to surface daily targets vs your genome and lab profile.
        NSHealthUpdateUsageDescription: Optional — write session annotations back to your health record.
        NSCalendarsFullAccessUsageDescription: Surfaces your upcoming events on the Now tab and lets you create reminders from Goals + Reach Out.
        UIBackgroundModes:
          - fetch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: PersonalData/Resources/PersonalData.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jlgao.PersonalData
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jlgao.PersonalData
        com.apple.security.application-groups:
          - group.com.jlgao.PersonalData
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.jlgao.PersonalData
    dependencies:
      - target: FrontalLobeWidget

  FrontalLobeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FrontalLobeWidget
        excludes:
          - "**/.DS_Store"
    info:
      path: FrontalLobeWidget/Info.plist
      properties:
        CFBundleDisplayName: Frontal Lobe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FrontalLobeWidget/FrontalLobeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jlgao.PersonalData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlgao.PersonalData.FrontalLobeWidget
        SKIP_INSTALL: YES

name: PrefrontalCortex
options:
  bundleIdPrefix: com.jlgao
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "202605190147"
    DEVELOPMENT_TEAM: 7SK8MG8FY6

targets:
  PrefrontalCortex:
    type: application
    platform: iOS
    sources:
      - path: PrefrontalCortex
        excludes:
          - "**/.DS_Store"
          # seeds/ holds factory-reset copies whose filenames collide
          # with the bundled config (exercise_library.json /
          # health_profile.json). Excluded from the flat glob and
          # re-added below as a folder reference so the directory
          # structure is preserved in the .app (seeds/<file>) instead
          # of flattening to the bundle root → "Multiple commands
          # produce …/exercise_library.json". (Durable equivalent of
          # the earlier pbxproj-only fix that xcodegen regenerate
          # discarded.)
          - "Resources/seeds"
      - path: PrefrontalCortex/Resources/seeds
        type: folder
      - path: PrefrontalCortexShared
        excludes:
          - "**/.keep"
    info:
      path: PrefrontalCortex/Resources/Info.plist
      properties:
        CFBundleDisplayName: Prefrontal Cortex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        NSHealthShareUsageDescription: Reads heart rate, sleep, weight, and other vitals to surface daily targets vs your genome and lab profile.
        NSHealthUpdateUsageDescription: Optional — write session annotations back to your health record.
        NSCalendarsFullAccessUsageDescription: Surfaces your upcoming events on the Now tab and lets you create reminders from Goals + Reach Out.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to your laptop on the same Wi-Fi to sync the daily bundle.
        UIBackgroundModes:
          - fetch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSUbiquitousContainers:
          iCloud.com.jlgao.PrefrontalCortex:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: PrefrontalCortex
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: PrefrontalCortex/Resources/PrefrontalCortex.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.jlgao.PrefrontalCortex
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jlgao.PrefrontalCortex
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jlgao.PrefrontalCortex
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.jlgao.PrefrontalCortex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PrefrontalCortexWidget
      - sdk: ActivityKit.framework

  PrefrontalCortexWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PrefrontalCortexWidget
        excludes:
          - "**/.DS_Store"
      - path: PrefrontalCortexShared
        excludes:
          - "**/.keep"
    info:
      path: PrefrontalCortexWidget/Info.plist
      properties:
        CFBundleDisplayName: Prefrontal Cortex
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PrefrontalCortexWidget/PrefrontalCortexWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jlgao.PrefrontalCortex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jlgao.PrefrontalCortex.PrefrontalCortexWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  PrefrontalCortexTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PrefrontalCortexTests]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrefrontalCortex.app/PrefrontalCortex"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.jlgao.PrefrontalCortexTests
    dependencies:
      - target: PrefrontalCortex

# Both schemes launch the host app. Without this, the auto-generated widget
# scheme tries to launch the extension binary directly — iOS can't do that
# (extensions are loaded by the host or by the system), so Xcode reports
# "Could not attach to pid: <N>" / "no such process". Making the widget
# scheme run the host app means picking either scheme works.
schemes:
  PrefrontalCortex:
    build:
      targets:
        PrefrontalCortex: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PrefrontalCortexWidget:
    build:
      targets:
        PrefrontalCortex: all
        PrefrontalCortexWidget: all
    run:
      config: Debug
      executable: PrefrontalCortex
    profile:
      config: Release
      executable: PrefrontalCortex
    analyze:
      config: Debug
    archive:
      config: Release
  PrefrontalCortexTests:
    build:
      targets:
        PrefrontalCortex: all
        PrefrontalCortexTests: [test]
    test:
      config: Debug
      targets:
        - PrefrontalCortexTests
